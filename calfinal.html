<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/x-icon" href="calogSR.png">
    <title>SR Calculators</title>
    <style>
        /* General Styles */
body{
background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
}
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .calculator {
            background-color: #2c3e50;
            border-radius: 15px;
            box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.2);
            width: 700;
            padding: 20px;
        }

        /* Display Screen */
        #result {
            width: 100%;
            height: 60px;
            background-color: #34495e;
            color: #ecf0f1;
            font-size: 24px;
            font-weight: bold;
            text-align: right;
            border: none;
            border-radius: 5;
            padding: 10px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        /* Buttons */
        .buttons {
            display: grid;
            grid-template-columns: repeat(8 ,1fr);
            gap: 7px;
        }

        input[type="button"] {
            width: 100%;
            padding: 20px;
            background-color: #34495e;
            color: #ecf0f1;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        input[type="button"]:hover {
            background-color: #1abc9c;
        }

        input[type="button"][value="="] {
            background-color: #e67e22;
            grid-column: span 1
        }

        input[type="button"][value="="]:hover {
            background-color: #d35400;
        }

        input[type="button"][value="AC"] {
            background-color: #e74c3c;
        }

        input[type="button"][value="AC"]:hover {
            background-color: #c0392b;
        }

        /* Top Icons */
        .top-icons {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .top-icons img {
            width: 50px;
            height: 50x;
            cursor: pointer;
        }

h1 {
    background: linear-gradient(#e67e22,#9b59b6,#e91e63,#1abc9c);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    font-size: 36px;
    font-weight: bold;
}    


    </style>
</head>
<body>
    <div class="calculator">
	<h1 align="center">SR calculations</h1>

   <!-- Display Screen -->
        <input type="text" id="result" >
        <!-- Top Icons -->
        <div class="top-icons">
            <a href="calhistory.html"><img src="calhistory.png" alt="History"></a>
            <a href="calminfinal.html"><img src="calmin.png" alt="Minimize"></a>
            <a href="calrates.html"><img src="calrates.png" alt="Rates"></a>
        </div>

  

        <!-- Buttons -->
        <div class="buttons">
            <input type="button" value="2nd">
            <input type="button" value="(" onclick="dis('(')">
            <input type="button" value=")" onclick="dis(')')">
            <input type="button" value="10x" onclick="dis('10x')">
            <input type="button" value="mc" onclick="dis('mc')">
            <input type="button" value="m+" onclick="dis('m+')">
            <input type="button" value="m-" onclick="dis('m-')">
            <input type="button" value="mr" onclick="dis('mr')">
            <input type="button" value="1/x" onclick="dis('1/x')">
            <input type="button" value="x²" onclick="dis('²')">
            <input type="button" value="x³" onclick="dis('³')">
            <input type="button" value="xʸ" onclick="dis('^')">
            <input type="button" value="AC" onclick="clr()">
            <input type="button" value="X" onclick="remove()">
            <input type="button" value="+/-" onclick="dis('+/-')">
            <input type="button" value="/" onclick="dis('/')">
            <input type="button" value="x!" onclick="dis('!')">
            <input type="button" value="√" onclick="dis('sqrt(')">
            <input type="button" value="ʸ√x" onclick="dis('^(1/')">
            <input type="button" value="lg" onclick="dis('log10(')">
            <input type="button" value="7" onclick="dis('7')">
            <input type="button" value="8" onclick="dis('8')">
            <input type="button" value="9" onclick="dis('9')">
            <input type="button" value="*" onclick="dis('*')">
            <input type="button" value="sin" onclick="dis('sin(')">
            <input type="button" value="cos" onclick="dis('cos(')">
            <input type="button" value="tan" onclick="dis('tan(')">
            <input type="button" value="ln" onclick="dis('ln(')">
            <input type="button" value="4" onclick="dis('4')">
            <input type="button" value="5" onclick="dis('5')">
            <input type="button" value="6" onclick="dis('6')">
            <input type="button" value="-" onclick="dis('-')">
            <input type="button" value="sinh" onclick="dis('sinh(')">
            <input type="button" value="cosh" onclick="dis('cosh(')">
            <input type="button" value="tanh" onclick="dis('tanh(')">
            <input type="button" value="eˣ" onclick="dis('exp(')">
            <input type="button" value="1" onclick="dis('1')">
            <input type="button" value="2" onclick="dis('2')">
            <input type="button" value="3" onclick="dis('3')">
            <input type="button" value="+" onclick="dis('+')">
            <input type="button" value="Deg" onclick="dis('Deg')">
            <input type="button" value="π" onclick="dis('pi')">
            <input type="button" value="EE" onclick="dis('e')">
            <input type="button" value="Rand" onclick="dis('rand()')">
            <input type="button" value="%" onclick="dis('%')">
            <input type="button" value="0" onclick="dis('0')">
            <input type="button" value="." onclick="dis('.')">
            <input type="button" value="=" onclick="solve()">
        </div>
    </div>

    <!-- Math.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/10.6.4/math.min.js"></script>

    <!-- Calculator Script -->
    <script>

        // Function to display value
        function dis(val) {
            document.getElementById("result").value += val;
        }

        // Function to evaluate the expression
        function solve() {
            let x = document.getElementById("result").value;
            try {
                let y = math.evaluate(x);
                document.getElementById("result").value = y;
            } catch (error) {
                document.getElementById("result").value = "Error";
            }
        }

        
      // Function to clear the display
        function clr() {
            document.getElementById("result").value = "";
        }
        // Function to remove the last character
        function remove() {
            let currentValue = document.getElementById("result").value;
            document.getElementById("result").value = currentValue.slice(0, -1);
        }
     
// Handle arrow key navigation for buttons and input fields
document.addEventListener('keydown', (event) => {
    // Select both input buttons and other input fields
    const inputs = document.querySelectorAll('.buttons input[type="button"], .buttons input[type="text"], .buttons input[type="email"], .buttons input[type="password"]');
    let focusedInputIndex = Array.from(inputs).findIndex(input => input === document.activeElement);

    // Allow arrow keys to navigate within text fields
    if (document.activeElement.tagName === 'INPUT' && ['text', 'email', 'password'].includes(document.activeElement.type)) {
        return; // Do nothing if currently editing a text field
    }

    if (event.key === 'ArrowRight') {
        event.preventDefault();
        if (focusedInputIndex < inputs.length - 1) {
            inputs[focusedInputIndex + 1].focus();
        }
    } else if (event.key === 'ArrowLeft') {
        event.preventDefault();
        if (focusedInputIndex > 0) {
            inputs[focusedInputIndex - 1].focus();
        }
    } else if (event.key === 'ArrowDown') {
        event.preventDefault();
        if (focusedInputIndex + 8 < inputs.length) {
            inputs[focusedInputIndex + 8].focus();
        }
    } else if (event.key === 'ArrowUp') {
        event.preventDefault();
        if (focusedInputIndex - 8 >= 0) {
            inputs[focusedInputIndex - 8].focus();
        }
    }
});

    // Handle keyboard input for the display area
    const inputField = document.getElementById('result');

    inputField.addEventListener('keypress', (event) => {
        if (event.key === 'Enter') {
            solve(); // Evaluate the expression when Enter is pressed
        }
    });



</script>

</body>
</html>
